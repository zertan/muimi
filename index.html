<!DOCTYPE html>
<html lang="en">
<head>
  <script type="module">
    export * from "./src/main/index.cljs";
  </script>
  <style>
    body { margin: 0; font-family: 'JetBrains Mono', monospace; background: #000; color: #f2f2f2; height: "100vh"; }
    .app { padding: 32px; min-height: 100vh; position: relative; }
    .layout { display: grid; grid-template-columns: 16rem 1fr 16rem; gap: 20px; }
    .pane { background: #000; padding: 12px; }
    .pane-fixed { position: sticky; top: 0; align-self: start; max-height: 100vh; overflow: auto; }
    .hero { margin-bottom: 24px; }
    .title { margin: 0 0 8px; }
    .subtitle { margin: 0; color: #b0b3b8; }
    .menu-title { letter-spacing: 0.1em; font-size: 12px; color: #b0b3b8; margin: 0 0 8px; text-transform: uppercase; }
    .tag-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .tag { padding: 4px 8px; background: #050505; }
    /* container for the vertical list */
    .category-list {
	display: flex;
	flex-direction: column;
	gap: 6px;
	width: 100%;
    }

    /* your base */
    .category-chip,
    .post-row {
	background: #000;
	border: none;
	text-align: left;
	padding: 8px;
	cursor: pointer;
	width: 100%;
    }

    /* category list styling */
    .category-chip {
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: 10px;

	color: rgba(255, 255, 255, 0.9);
	border-radius: 10px;
	line-height: 1.1;

	/* subtle separation without borders */
	box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08) inset;
	transition: transform 80ms ease, box-shadow 120ms ease, background 120ms ease;
    }

    .category-chip:hover {
	background: rgba(255, 255, 255, 0.04);
	box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.16) inset;
    }

    .category-chip:active {
	transform: translateY(1px);
    }

    /* keyboard focus */
    .category-chip:focus-visible {
	outline: none;
	box-shadow:
	    0 0 0 2px rgba(255, 255, 255, 0.22),
	    0 0 0 1px rgba(255, 255, 255, 0.14) inset;
    }

    /* selected/active state */
    .category-chip.is-active,
    .category-chip[aria-current="true"] {
	background: rgba(255, 255, 255, 0.08);
	box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.22) inset;
    }

    /* optional sub-elements */
    .category-chip .label {
	font-weight: 600;
	letter-spacing: 0.2px;
    }

    .category-chip .count {
	font-size: 12px;
	padding: 2px 8px;
	border-radius: 999px;
	color: rgba(255, 255, 255, 0.8);
	background: rgba(255, 255, 255, 0.08);
    }


    .post-row-title { font-size: 14px; }
    .post-row-meta { font-size: 11px; color: #b0b3b8; }
    .brand { margin-bottom: 12px; }
    .brand-name { font-size: 18px; letter-spacing: 0.08em; text-transform: uppercase; }
    .brand-caption { color: #b0b3b8; font-size: 12px; }
    .about-link { display: inline-block; margin-bottom: 12px; color: #f2f2f2; text-decoration: none; letter-spacing: 0.08em; }
    .about-link:hover { color: #fff; }
    .subscribe { position: fixed; left: 16px; bottom: 16px; background: #050505; padding: 12px; border: 1px solid #111; }
    .subscribe-form { display: flex; gap: 8px; }
    .subscribe-form input { background: #000; color: #f2f2f2; border: 1px solid #333; padding: 8px; }
    .subscribe-form button { background: #111; color: #f2f2f2; border: 1px solid #333; padding: 8px 12px; cursor: pointer; }
    .markdown-body h1, .markdown-body h2, .markdown-body h3 { margin-top: 24px; margin-bottom: 8px; }
    .markdown-body pre { background: #050505; padding: 12px; border: 1px solid #111; overflow-x: auto; }
    .markdown-body code { font-family: 'JetBrains Mono', monospace; color: #7cffb7; }
    .markdown-body p { line-height: 1.6; }
    .markdown-body ul { padding-left: 20px; }
  </style>
</head>
<body>
  <div id="root"></div>
</body>
</html>
